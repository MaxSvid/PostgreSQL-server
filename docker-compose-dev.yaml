# Cap each container's logs at 3 x 10 MB so they can't fill the VPS disk
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  alpha1_net:
    name: alpha1_vps_network
    driver: bridge

services:
  postgres:
    image: postgres:18
    container_name: beta1_postgres
    restart: unless-stopped
    stop_grace_period: 60s # let Postgres finish its shutdown checkpoint 
    logging: *logging
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"] # repo config replaces the generated one in PGDATA
    shm_size: 256mb # /dev/shm for parallel query (Docker default is 64MB)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA:?set PGDATA in .env}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD} # pg_hba method, written on first init
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432" # localhost only reach it remotely via SSH tunnel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/init:/docker-entrypoint-initdb.d # autoruns .sql files here

    networks:
      - alpha1_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.docker.compose.service=postgres"
      - "maintainer=your.dev.mail@mail.com"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: beta1_pgbouncer
    restart: unless-stopped
    logging: *logging
    # All settings (connection, auth, pooling) are in config/pgbouncer/pgbouncer.ini.
    environment:
      DB_USER: pgbouncer_auth
      DB_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?PGBOUNCER_AUTH_PASSWORD is required}
      AUTH_TYPE: scram-sha-256 # makes the image store the password as plain text
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT}:5432" # localhost only reach it remotely via SSH tunnel
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    networks:
      - alpha1_net
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: beta1_pgadmin
    restart: unless-stopped
    logging: *logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True" # multi-user: one pgAdmin account per team member
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True" # encrypts saved DB passwords per user
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80" # localhost only reach it remotely via SSH tunnel
    volumes:
      - pgadmin_data:/var/lib/pgadmin # accounts, registered servers, preferences
    networks:
      - alpha1_net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: beta1_postgres_data
  pgadmin_data:
    name: beta1_pgadmin_data
