listen_addresses = '*'
port = 5432
# PgBouncer (default_pool_size x databases) must stay below this
max_connections = 50
superuser_reserved_connections = 3

# Authentication
password_encryption = scram-sha-256
ssl = off

# Memory
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
dynamic_shared_memory_type = posix

# WAL settings
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Planner (VPS disks are SSDs)
random_page_cost = 1.1
effective_io_concurrency = 200

# Extensions loaded at start (restart-only setting)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
# Don't record utility commands (CREATE/ALTER ROLE ... PASSWORD '...')
pg_stat_statements.track_utility = off

# Logging to stderr goes to docker logs
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 10s
log_checkpoints = on

# Safety nets
idle_in_transaction_session_timeout = 5min

# Locale time
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'