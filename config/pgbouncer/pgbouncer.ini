[databases]
# Wildcard matching for all incoming database names
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
user = postgres

# Live password lookup via pgbouncer_auth role
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM public.pgbouncer_auth_lookup($1)

pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
max_db_connections = 30
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits