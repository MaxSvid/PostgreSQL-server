[databases]
; Wildcard: logins only work for POSTGRES_DB, where pgbouncer_auth_lookup() lives
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
; Drop root (the image's generated config would set this; ours replaces it)
user = postgres

; Auth: only pgbouncer_auth's password is in auth_file (written by the image
; from DB_USER/DB_PASSWORD); every other role is looked up live
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM public.pgbouncer_auth_lookup($1)

; Pooling (comments must be on their own line: PgBouncer reads a value to the
; end of the line, so a trailing "; ..." would become part of the value).
; pool_mode is NOT set here: it comes from POOL_MODE in docker-compose-dev.yaml
; and is appended at container start, so [pgbouncer] must stay the last section.
; bot connections accepted
max_client_conn = 200
; per user+database
default_pool_size = 10
; hard cap on Postgres backends (max_connections = 50)
max_db_connections = 30
; asyncpg prepared statements in transaction mode
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
